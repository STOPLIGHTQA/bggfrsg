info:
  title: 2.0 JS
  version: '1.0'
host: 'localhost:3000'
basePath: /
schemes:
  - http
paths:
  '/users/{userId}':
    get:
      summary: Get User Info by User ID
      description: Retrieve the information of the user with the matching user ID.
      operationId: get-users-userId
      produces:
        - application/json
      parameters:
        - name: userId
          in: path
          description: Id of an existing user.
          required: true
          type: integer
      schemes:
        - http
      responses:
        '200':
          description: User Found
          schema:
            type: object
            properties:
              ngjgh:
                $ref: 'https://stoplight.io/api/v1/projects/persistentteams/dliata/nodes/IATA_Open_Air_JSON_Library_24.4.0%201.json/components/schemas/Account?mid=40830'
              vhhgdc:
                $ref: 'https://stoplight.io/api/v1/projects/persistentteams/ppp-dl/nodes/IATA_Open_Air_JSON_Library_24.4.0%205%20(2).json/components/schemas/AgencyCodeEnum?mid=54'
          examples:
            Get User Alice Smith:
              id: 142
              firstName: Alice
              lastName: Smith
              email: alice.smith@gmail.com
              dateOfBirth: '1997-10-31'
              emailVerified: true
              signUpDate: '2019-08-24'
        '404':
          description: User Not Found
          schema:
            x-nullable: true
      x-stoplight:
        id: m48yqxdd9lpwh
    patch:
      summary: Update User Information
      description: Update the information of an existing user.
      operationId: patch-users-userId
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - name: userId
          in: path
          description: Id of an existing user.
          required: true
          type: integer
        - in: body
          name: body
          schema:
            type: object
            properties:
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
                description: 'If a new email is given, the user''s email verified property will be set to false.'
              dateOfBirth:
                type: string
          description: Patch user properties to update.
      schemes:
        - http
      responses:
        '200':
          description: User Updated
          schema:
            $ref: '#/definitions/User'
          examples:
            Update User Rebecca Baker:
              id: 13
              firstName: Rebecca
              lastName: Baker
              email: rebecca@gmail.com
              dateOfBirth: '1985-10-02'
              emailVerified: false
              createDate: '2019-08-24'
        '404':
          description: User Not Found
          schema:
            x-nullable: true
        '409':
          description: Email Already Taken
          schema:
            x-nullable: true
      x-stoplight:
        id: n5lwvyiiufd9s
  /user:
    post:
      summary: Create New User
      description: Create a new user.
      operationId: post-user
      produces:
        - application/json
      consumes:
        - application/json
      parameters:
        - in: body
          name: body
          schema:
            type: object
            properties:
              firstName:
                type: string
              lastName:
                type: string
              email:
                type: string
              dateOfBirth:
                type: string
                format: date
            required:
              - firstName
              - lastName
              - email
              - dateOfBirth
          description: Post the necessary fields for the API to create a new user.
      schemes:
        - http
      responses:
        '200':
          description: User Created
          schema:
            $ref: '#/definitions/User'
        '400':
          description: Missing Required Information
          schema:
            x-nullable: true
        '409':
          description: Email Already Taken
          schema:
            x-nullable: true
      x-stoplight:
        id: 4unonagpzo06v
definitions:
  User:
    type: object
    title: User
    description: the user1234567
    properties:
      id:
        type: integer
        description: Unique identifier for the given user.
      firstName:
        type: string
      lastName:
        type: string
      email:
        type: string
        format: email
      dateOfBirth:
        type: string
        format: date
        x-examples:
          - '1997-10-31'
      emailVerified:
        type: boolean
        description: Set to true if the user's email has been verified.
      createdate:
        $ref: 'https://stoplight.io/api/v1/projects/persistentteams/dliata/nodes/IATA_Open_Air_JSON_Library_24.4.0%201.json/components/schemas/AccessGate?deref=bundle'
    required:
      - id
      - firstName
      - lastName
      - email
      - emailVerified
      - createdate
    x-internal: true
    x-stoplight:
      id: ony6yvhcr86dz
